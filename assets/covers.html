<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Covers</title>
<!--
  Cover image generator. Cover image generator for the article and Devpost thumbnail
  and extended with the Devpost variant for the hackathon submission.

  Variants:
    ?v=devpost  1500x1000 (3:2, what Devpost asks for)  -> Devpost project thumbnail
    ?v=medium   1500x850                                -> the Medium article cover
    ?v=diagram-*                                        -> the article's agent-graph diagrams

  Add &shot=1 to hide the download button for headless screenshots.
  Export: Download PNG button, or headless Chrome:
    chrome --headless --screenshot=devpost-cover.png --window-size=1500,1000 --force-device-scale-factor=2 "file://.../covers.html?v=devpost&shot=1"
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: 'Inter', sans-serif; }

  .cover {
    position: relative;
    overflow: hidden;
    background: #0f2040;
    display: flex;
    flex-direction: column;
  }

  .bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #1a1040 0%, #0f2847 35%, #0a3a5e 60%, #1a4a3a 100%);
  }

  .glow-orange {
    position: absolute;
    top: -20%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(circle, rgba(255, 140, 50, 0.12) 0%, transparent 65%);
  }

  .glow-blue {
    position: absolute;
    bottom: -15%; left: -15%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(80, 130, 255, 0.08) 0%, transparent 65%);
  }

  .content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 80px;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title {
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .title .highlight { color: #ff9a3c; }

  .subtitle {
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.01em;
  }

  .author {
    font-weight: 500;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.5px;
  }

  /* Vertical pipeline diagram */
  .flow { position: relative; display: flex; flex-direction: column; align-items: stretch; }
  .node {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    position: relative; z-index: 1;
  }
  .node .nlabel { color: rgba(255, 255, 255, 0.88); font-weight: 600; }
  .node.code { border-color: rgba(120, 160, 255, 0.45); }
  .node.model { border-color: rgba(255, 154, 60, 0.45); }
  .tag { font-weight: 700; letter-spacing: 0.03em; }
  .node.code .tag { color: #a8c1ff; }
  .node.model .tag { color: #ffb86e; }
  .arrow {
    align-self: center; width: 0; height: 0; position: relative; z-index: 1;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-top: 12px solid rgba(255, 255, 255, 0.35);
  }
  .stem { align-self: center; width: 3px; background: rgba(255, 255, 255, 0.35); z-index: 1; }
  .fan { display: flex; z-index: 1; }
  .fan .node { flex: 1; justify-content: center; }
  .hbar { align-self: center; height: 3px; background: rgba(255, 255, 255, 0.35); z-index: 1; }
  .loop {
    position: absolute; z-index: 0;
    border: 3px solid rgba(255, 154, 60, 0.75);
    border-left: none;
    border-radius: 0 24px 24px 0;
  }
  .loop-label {
    position: absolute; z-index: 2;
    color: #ffb86e; font-weight: 700; letter-spacing: 0.02em;
    background: rgba(15, 32, 64, 0.85);
    padding: 4px 10px; border-radius: 8px;
  }
  .loop-arrow {
    position: absolute; z-index: 2; width: 0; height: 0;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    border-right: 13px solid rgba(255, 154, 60, 0.9);
  }

  /* Article diagram export (?v=diagram-simple | diagram-storycheck) */
  .diagram { width: 720px; min-height: 100vh; padding: 40px 80px; }
  .diagram .flow { width: 560px; }
  .diagram .node { height: 58px; border-radius: 13px; padding: 0 24px; }
  .diagram .node .nlabel { font-size: 22px; }
  .diagram .tag { font-size: 16px; }
  .diagram .stem { height: 8px; }
  .diagram .fan { gap: 14px; }
  .diagram .fan .node { height: 48px; padding: 0 6px; }
  .diagram .fan .node .nlabel { font-size: 17px; white-space: nowrap; }
  .diagram .lanes, .diagram .split { width: 560px; }
  .diagram .loop { right: -44px; width: 44px; }
  .diagram .loop-label { font-size: 16px; right: -72px; }

  /* Devpost thumbnail 1500x1000 (3:2) */
  .devpost { width: 1500px; height: 1000px; padding: 80px 100px; }
  .devpost .content { gap: 70px; }
  .devpost .title { font-size: 92px; max-width: 620px; line-height: 1.1; }
  .devpost .subtitle { font-size: 31px; margin-top: 38px; max-width: 580px; line-height: 1.45; }
  .devpost .author { font-size: 24px; margin-top: 52px; }
  /* keep the flow at 560px: the connector SVGs use a 560-wide viewBox and would
     letterbox out of alignment with the fan nodes at any other width */
  .devpost .flow { width: 560px; }
  .devpost .node { height: 64px; border-radius: 14px; padding: 0 26px; }
  .devpost .node .nlabel { font-size: 23px; }
  .devpost .tag { font-size: 16px; }
  .devpost .stem { height: 10px; }
  .devpost .fan { gap: 14px; }
  .devpost .fan .node { height: 52px; padding: 0 8px; }
  .devpost .fan .node .nlabel { font-size: 19px; }
  .devpost .lanes { width: 560px; height: 26px; }
  .devpost .split { width: 560px; height: 36px; }
  .devpost .loop { right: -46px; width: 46px; }
  .devpost .loop-label { font-size: 16px; right: -74px; }

  /* Medium 1500x850 */
  .medium { width: 1500px; height: 850px; padding: 56px 100px; }
  .medium .title { font-size: 72px; max-width: 640px; }
  .medium .subtitle { font-size: 30px; margin-top: 34px; max-width: 560px; }
  .medium .author { font-size: 26px; margin-top: 56px; }
  .medium .flow { width: 560px; }
  .medium .node { height: 58px; border-radius: 13px; padding: 0 24px; }
  .medium .node .nlabel { font-size: 22px; }
  .medium .tag { font-size: 16px; }
  .medium .stem { height: 8px; }
  .medium .fan { gap: 14px; }
  .medium .fan .node { height: 48px; padding: 0 8px; }
  .medium .lanes { width: 560px; height: 24px; }
  .medium .fan .node .nlabel { font-size: 19px; }
  .medium .split { width: 560px; height: 34px; }
  .medium .loop { right: -44px; width: 44px; }
  .medium .loop-label { font-size: 16px; right: -72px; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const variant = params.get('v') || 'medium';
  const isDiagram = variant.startsWith('diagram');
  const simple = variant === 'diagram-simple';
  const laneLoop = variant === 'diagram-storycheck-loop' || variant === 'medium' || variant === 'devpost';
  const COPY = {
    devpost: {
      title: 'Hacker News <span class="highlight">Digest</span>',
      subtitle: 'A daily podcast written, fact-checked, and published entirely by agents',
      author: '@ykdojo &nbsp;·&nbsp; ADK 2 &nbsp;·&nbsp; Gemini TTS &nbsp;·&nbsp; Cloud Run jobs',
    },
    medium: {
      title: 'Turning Hacker News into a NotebookLM-style <span class="highlight">daily podcast</span>',
      subtitle: 'ADK graphs, Cloud Run jobs, and Gemini TTS',
      author: '@ykdojo',
    },
  };
  const copy = COPY[variant] || COPY.medium;
  // tutorial build-up steps: ?v=diagram-step1..4
  const stepN = (variant.match(/^diagram-step(\d)$/) || [])[1];
  const stem = '<div class="stem"></div><div class="arrow"></div>';
  const panel = `
    <div class="flow" id="flow">
      <div class="node code"><div class="nlabel">Fetch the last 26 hours</div><div class="tag">code</div></div>
      ${stem}
      <div class="node model"><div class="nlabel">Curate 7-10 stories</div><div class="tag">model</div></div>
      <svg class="split" viewBox="0 0 560 34" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none">
          <path d="M280 0 V10 M65 10 H495 M65 10 V22 M208 10 V22 M352 10 V22 M495 10 V22"/>
        </g>
        <g fill="rgba(255,255,255,0.35)">
          <path d="M56 22 h18 l-9 12 z M199 22 h18 l-9 12 z M343 22 h18 l-9 12 z M486 22 h18 l-9 12 z"/>
        </g>
      </svg>
      <div class="fan">
        <div class="node model"><div class="nlabel">digest</div></div>
        <div class="node model"><div class="nlabel">digest</div></div>
        <div class="node model"><div class="nlabel">digest</div></div>
        <div class="node model"><div class="nlabel">digest</div></div>
      </div>
      ${simple ? '' : `<svg class="lanes" viewBox="0 0 560 24" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none">
          <path d="M65 0 V12 M208 0 V12 M352 0 V12 M495 0 V12"/>
        </g>
        <g fill="rgba(255,255,255,0.35)">
          <path d="M56 12 h18 l-9 11 z M199 12 h18 l-9 11 z M343 12 h18 l-9 11 z M486 12 h18 l-9 11 z"/>
        </g>
      </svg>
      <div class="fan" id="fanCheck">
        <div class="node model"><div class="nlabel">fact-check</div></div>
        <div class="node model"><div class="nlabel">fact-check</div></div>
        <div class="node model"><div class="nlabel">fact-check</div></div>
        <div class="node model"><div class="nlabel">fact-check</div></div>
      </div>`}
      <svg class="split" viewBox="0 0 560 34" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none">
          <path d="M65 0 V12 M208 0 V12 M352 0 V12 M495 0 V12 M65 12 H495 M280 12 V22"/>
        </g>
        <g fill="rgba(255,255,255,0.35)">
          <path d="M271 22 h18 l-9 12 z"/>
        </g>
      </svg>
      <div class="node model" id="scriptnode"><div class="nlabel">Write the script</div><div class="tag">model</div></div>
      ${stem}
      <div class="node model" id="checknode"><div class="nlabel">Fact-check every claim</div><div class="tag">model</div></div>
      ${stem}
      <div class="node model"><div class="nlabel">Render speech in segments</div><div class="tag">TTS</div></div>
      ${stem}
      <div class="node code"><div class="nlabel">Publish mp3 + RSS</div><div class="tag">code</div></div>
      <div class="loop" id="loop"></div>
      <div class="loop-label" id="looplabel">rewrite &le;2</div>
      <div class="loop-arrow" id="looparrow"></div>
      ${laneLoop ? `<div class="loop" id="loop2"></div>
      <div class="loop-label" id="looplabel2">repair &le;2</div>
      <div class="loop-arrow" id="looparrow2"></div>` : ''}
    </div>`;
  const STEP_NODES = {
    1: [['Fetch stories', 'code', 'code'], ['Write the episode', 'model', 'model']],
    2: [['Fetch stories', 'code', 'code'], ['Curate', 'model', 'model'],
        ['Write the episode', 'model', 'model']],
    3: [['Fetch stories', 'code', 'code'], ['Curate', 'model', 'model'],
        ['Write the episode', 'model', 'model'], ['Fact-check', 'model', 'model']],
    4: [['Fetch stories', 'code', 'code'], ['Curate', 'model', 'model'],
        ['Write the episode', 'model', 'model'], ['Fact-check', 'model', 'model']],
  };
  let stepPanel = '';
  if (stepN) {
    const ns = STEP_NODES[stepN];
    stepPanel = `<div class="flow" id="flow">` + ns.map(([label, cls, tag], i) => `
      ${i ? stem : ''}
      <div class="node ${cls}" ${label === 'Write the episode' ? 'id="scriptnode"' : ''} ${label === 'Fact-check' ? 'id="checknode"' : ''}>
        <div class="nlabel">${label}</div><div class="tag">${tag}</div>
      </div>`).join('') + (stepN === '4' ? `
      <div class="loop" id="loop"></div>
      <div class="loop-label" id="looplabel">rewrite &le;2</div>
      <div class="loop-arrow" id="looparrow"></div>` : '') + `</div>`;
  }

  document.write(isDiagram ? `
    <div class="cover diagram" id="cover">
      <div class="bg"></div>
      ${stepPanel || panel}` : `
    <div class="cover ${variant}" id="cover">
      <div class="bg"></div>
      <div class="glow-orange"></div>
      <div class="glow-blue"></div>
      <div class="content">
        <div class="left">
          <div class="title">${copy.title}</div>
          <div class="subtitle">${copy.subtitle}</div>
          <div class="author">${copy.author}</div>
        </div>
        ${panel}
      </div>
      ${params.get('shot') ? '' : '<button id="download" style="position:fixed;top:16px;right:16px;z-index:10;padding:10px 20px;font:600 14px Inter,sans-serif;border:1px solid rgba(255,255,255,0.3);border-radius:8px;background:rgba(0,0,0,0.5);color:#fff;cursor:pointer;">Download PNG</button>'}
  `);

  if (stepN && stepN !== '4') {
    // no loop elements in steps 1-3
  }
  if (laneLoop && !stepN) {
    // repair arc: per-story fact-check row -> digest row
    const digRow = document.querySelectorAll('.fan')[0];
    const chkRow = document.getElementById('fanCheck');
    const top = digRow.offsetTop + digRow.offsetHeight / 2;
    const bottom = chkRow.offsetTop + chkRow.offsetHeight / 2;
    const loop2 = document.getElementById('loop2');
    loop2.style.top = top + 'px';
    loop2.style.height = (bottom - top) + 'px';
    document.getElementById('looplabel2').style.top = (top + (bottom - top) / 2 - 15) + 'px';
    const arr2 = document.getElementById('looparrow2');
    arr2.style.top = (top - 9) + 'px';
    arr2.style.right = '-2px';
  }

  // loop-back arc: fact-check -> write the script
  (function positionLoop() {
    const a = document.getElementById('scriptnode');
    const b = document.getElementById('checknode');
    if (!a || !b || !document.getElementById('loop')) return;
    const top = a.offsetTop + a.offsetHeight / 2;
    const bottom = b.offsetTop + b.offsetHeight / 2;
    const loop = document.getElementById('loop');
    loop.style.top = top + 'px';
    loop.style.height = (bottom - top) + 'px';
    const lbl = document.getElementById('looplabel');
    lbl.style.top = (top + (bottom - top) / 2 - 15) + 'px';
    const arr = document.getElementById('looparrow');
    arr.style.top = (top - 9) + 'px';
    arr.style.right = '-2px';
  })();

  const btn = document.getElementById('download');
  if (btn) btn.addEventListener('click', async () => {
    btn.style.display = 'none';
    await document.fonts.ready;
    const el = document.getElementById('cover');
    const canvas = await html2canvas(el, { scale: 1, backgroundColor: '#0f2040', logging: false });
    const a = document.createElement('a');
    a.download = `cover-${variant}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    btn.style.display = '';
  });
</script>
</body>
</html>
